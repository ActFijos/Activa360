name: activa360-e3

services:
  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: e3-postgres
    environment:
      POSTGRES_DB: activa360
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - "./bench/e3/seed.sql:/docker-entrypoint-initdb.d/seed.sql:ro"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d activa360"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    image: activa360/app:e3
    container_name: e3-api
    command: ["node", "dist/src/main.js"]
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/activa360?schema=public
      REPORTS_MODO: ${REPORTS_MODO:-proceso}
      REPORTS_URL: http://toxiproxy:8666
    ports:
      - "127.0.0.1:18300:3000"
    depends_on:
      postgres: { condition: service_healthy }
      reports: { condition: service_healthy, required: false }
      toxiproxy: { condition: service_started, required: false }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/stats').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  reports:
    image: activa360/app:e3
    container_name: e3-reports
    profiles: ["extraido"]
    command: ["node", "dist/src/main-reports.js"]
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://admin:adminpassword@postgres:5432/activa360?schema=public
    ports:
      - "127.0.0.1:18301:3001"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/salud').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 2s
      retries: 20

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.13.0@sha256:5d3dae09bc185dcc5ff6cf43abf6062a4a720aff0c4306a471e773acdcd107aa
    container_name: e3-toxiproxy
    profiles: ["extraido"]
    command: ["-host=0.0.0.0", "-config=/config/toxiproxy.json"]
    environment:
      LOG_LEVEL: error
    volumes:
      - "./toxiproxy/toxiproxy.json:/config/toxiproxy.json:ro"
    ports:
      - "127.0.0.1:18310:8474"
    depends_on:
      reports: { condition: service_healthy }

  k6:
    image: grafana/k6:2.3.0@sha256:2dd4756ec6e14e62778916e1eb850108e4b499304c02df56760fa0bdb0fba0b8
    profiles: ["carga"]
    volumes:
      - "./bench/e3/k6:/k6:ro"
      - "./bench/e3/resultados:/out"


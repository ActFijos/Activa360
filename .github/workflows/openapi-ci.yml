name: OpenAPI CI (Validation, Drift & Spectral Lint)

on:
  pull_request:
    branches: [main, release/8.2.0, release/*]
  push:
    branches: [main, release/8.2.0, release/*]

jobs:
  openapi-validation:
    name: OpenAPI Export, Drift Check & Spectral Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Compilar proyecto NestJS
        run: npm run build

      - name: Generar contrato openapi.json desde el código
        run: npm run openapi:export
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://user:pass@localhost:5432/activa360_test' }}
          PORT: 3001

      - name: Comprobar que no exista drift con openapi.json en el repositorio
        run: |
          if [ -f openapi.json ]; then
            git diff --exit-code openapi.json || \
              (echo "❌ DRIFT DETECTADO: openapi.json en el repositorio no coincide con la versión generada desde el código. Ejecuta 'npm run openapi:export' y commitea los cambios." && exit 1)
          else
            echo "❌ openapi.json no existe en el repositorio."
            exit 1
          fi

      - name: Ejecutar linter Spectral sobre openapi.json
        run: npx @stoplight/spectral-cli lint openapi.json --ruleset .spectral.yaml --fail-severity warn

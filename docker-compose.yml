services:
  postgres:
    image: postgres:16-alpine
    container_name: activa360-postgres
    environment:
      POSTGRES_DB: activa360
      POSTGRES_USER: activa360
      POSTGRES_PASSWORD: activa360
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activa360 -d activa360"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: activa360-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: activa360-keycloak
    command:
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/activa360
      KC_DB_USERNAME: activa360
      KC_DB_PASSWORD: activa360
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    volumes:
      - ./docker/keycloak:/opt/keycloak/data/import:ro
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    image: minio/minio:latest
    container_name: activa360-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  backend:
    build:
      context: ./apps/api
    container_name: activa360-backend
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_FLYWAY_ENABLED: "false"
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: activa360
      DB_USER: activa360
      DB_PASSWORD: activa360
      REDIS_HOST: redis
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/activa360
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  frontend:
    build:
      context: ./apps/web
    container_name: activa360-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres-data:
  minio-data:

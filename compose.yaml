services:
  # Base de Datos PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: activa360-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: activa360
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adminpassword
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d activa360"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend NestJS (Arquitectura Hexagonal)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: activa360-backend
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: "postgresql://admin:adminpassword@postgres:5432/activa360?schema=app"
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Frontend React + Vite SPA
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: activa360-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres_data:
